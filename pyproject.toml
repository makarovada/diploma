[project]
name = "datanorma"
version = "0.1.0"
description = "Конфигурируемая интеграция и нормализация данных для МСБ (Dagster): любые источники → каноническая схема"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
    "pyyaml>=6.0",
]

[tool.setuptools.package-data]
datanorma = ["schemas/*.yaml"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["datanorma*"]
