[project]
name = "datanorma"
version = "0.1.0"
description = "Конфигурируемая интеграция и нормализация данных для МСБ (Dagster): любые источники → normalized/semantic слой"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0.0",
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0.0",
    "bcrypt>=4.0.0",
    "croniter>=2.0.0",
    "dbt-core>=1.7.0,<2",
    "dbt-postgres>=1.7.0,<2",
    "dagster-dbt>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "allure-pytest>=2.13.0",
]
load = [
    "locust>=2.32.0",
]
# Тяжёлая цепочка зависимостей — только когда нужны рантайм-утилиты CDK рядом с проектом.
dev-ingest = [
    "ingest-cdk>=6.0.0",
]

[tool.setuptools.package-data]
datanorma = ["schemas/*.yaml"]
"datanorma.web" = ["static/*", "templates/*.html"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["datanorma*"]

[tool.coverage.run]
omit = [
    "datanorma/assets/normalized.py",
    "datanorma/assets/sync_catalog.py",
    "datanorma/ingest/stream_config.py",
    "datanorma/normalization/cbr_rates.py",
    "datanorma/normalization/contacts.py",
    "datanorma/normalization/dates_msk.py",
    "datanorma/normalization/default_stream_rules.py",
    "datanorma/normalization/enrich.py",
    "datanorma/normalization/person_name.py",
    "datanorma/normalization/references.py",
    "datanorma/normalization/statuses.py",
    "datanorma/normalization/typing.py",
    "datanorma/normalization/units.py",
    "datanorma/schedules/alerts.py",
    "datanorma/sources/onec.py",
    "datanorma/sources/ozon.py",
    "datanorma/sources/sheets.py",
    "datanorma/warehouse/load.py",
    "datanorma/warehouse/sync_state_repo.py",
    "datanorma/warehouse/tables.py",
    "datanorma/web/api_v1_catalog.py",
    "datanorma/web/audit_repo.py",
    "datanorma/web/users_repo.py",
]
