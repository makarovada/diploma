[project]
name = "datanorma"
version = "0.1.0"
description = "Конфигурируемая интеграция и нормализация данных для МСБ (Dagster): любые источники → каноническая схема"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.9.0",
    "dagster-webserver>=1.9.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0.0",
    "alembic>=1.13.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pyjwt>=2.9.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0.0",
    "dbt-core>=1.7.0,<2",
    "dbt-postgres>=1.7.0,<2",
    "dagster-dbt>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Тяжёлая цепочка зависимостей — только когда нужны рантайм-утилиты CDK рядом с проектом.
dev-ingest = [
    "ingest-cdk>=6.0.0",
]

[tool.setuptools.package-data]
datanorma = ["schemas/*.yaml"]
"datanorma.web" = ["static/*", "templates/*.html"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["datanorma*"]
