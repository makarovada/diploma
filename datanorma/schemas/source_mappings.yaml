# Маппинг полей источников → canonical_sales_v1.
# Для своей компании скопируйте файл, поправьте поля под вашу выгрузку
# и укажите путь в DATANORMA_SOURCE_MAPPINGS_PATH.
version: 1
canonical: canonical_sales_v1

# Глобальный порог fuzzy для column_map (0 = выкл.). Переопределяется в источнике.
options:
  fuzzy_column_threshold: 0

sources:
  ozon:
    handler: ozon_fbs_postings
    stream: postings
    sync_mode: incremental
    cursor_field: posting_number
  "1c":
    fuzzy_column_threshold: 85
    handler: column_map
    stream: orders
    sync_mode: full_refresh
    fields:
      ДатаДокумента: event_datetime
      Номер: source_record_id
      Контрагент: counterparty_name
      СуммаДокумента: amount
      Валюта: currency_code
      Комментарий: line_description
  google_sheet:
    handler: column_map
    stream: orders
    sync_mode: incremental
    cursor_field: order_id
    fields:
      order_id: source_record_id
      order_date: event_datetime
      customer_name: counterparty_name
      amount: amount
      currency: currency_code
      channel: channel

# Маркетинг / веб-аналитика → canonical_marketing_events_v1 (см. datanorma/normalization/marketing_events.py)
marketing:
  version: 1
  canonical: canonical_marketing_events_v1
  sources:
    yandex_metrika:
      source_system: yandex_metrika
      streams:
        summary:
          event_type: summary_daily
          source_record_id:
            - counter_id
            - literal:summary
            - date
          field_map:
            date: event_datetime
          copy_to_meta:
            visits: visits
            users: users
            bounce_rate: bounce_rate
            pageviews: pageviews
        visits:
          event_type: visit
          source_record_id:
            - counter_id
            - literal:visit
            - visit_id
          field_map:
            visit_id: visit_id
            client_id: client_id
            date_time: event_datetime
            traffic_source: traffic_source
            utm_source: utm_source
            utm_medium: utm_medium
            utm_campaign: utm_campaign
            device_category: device
            browser: browser
            region_country: region
        hits:
          event_type: hit
          source_record_id:
            - counter_id
            - literal:hit
            - hit_id
          field_map:
            visit_id: visit_id
            date_time: event_datetime
          copy_to_meta:
            hit_id: hit_id
            url: url
            title: title
        goals_reaches:
          event_type: goal_reach
          source_record_id:
            - counter_id
            - literal:goal
            - goal_id
            - visit_id
            - reach_datetime
          field_map:
            goal_id: goal_id
            goal_name: goal_name
            visit_id: visit_id
            client_id: client_id
            reach_datetime: event_datetime
            revenue: revenue
            currency: currency
