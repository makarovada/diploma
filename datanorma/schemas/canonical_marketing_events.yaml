# Каноническая модель маркетинговых / веб-событий (Яндекс Метрика, рекламные кабинеты).
version: 1
name: canonical_marketing_events_v1
description: >
  Унифицированные события веб-аналитики и маркетинга для витрин и сквозной аналитики.

fields:
  source_system:
    type: string
    description: Код источника (yandex_metrika, vk_ads, …).
  source_record_id:
    type: string
    description: Стабильный идентификатор записи в канонике.
  counter_id:
    type: string
    nullable: true
    description: Идентификатор счётчика / проекта во внешней системе.
  event_type:
    type: string
    description: Тип события (summary_daily, visit, hit, goal_reach, …).
  event_datetime:
    type: string
    format: iso8601
    nullable: true
  client_id:
    type: string
    nullable: true
  visit_id:
    type: string
    nullable: true
  traffic_source:
    type: string
    nullable: true
  utm_source:
    type: string
    nullable: true
  utm_medium:
    type: string
    nullable: true
  utm_campaign:
    type: string
    nullable: true
  device:
    type: string
    nullable: true
  browser:
    type: string
    nullable: true
  region:
    type: string
    nullable: true
  goal_id:
    type: string
    nullable: true
  goal_name:
    type: string
    nullable: true
  revenue:
    type: number
    nullable: true
  currency:
    type: string
    nullable: true
  _ingest_loaded_at:
    type: string
    format: iso8601
    nullable: true
  _ingest_meta:
    type: object
    nullable: true
