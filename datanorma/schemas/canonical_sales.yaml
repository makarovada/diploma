# Логическая витрина продаж: любые источники сводятся к этим полям.
# Конкретные CSV/API вашей компании подключаются через source_mappings.yaml
# или свой файл (DATANORMA_SOURCE_MAPPINGS_PATH).
version: 1
name: canonical_sales_v1
description: >
  Универсальный слой фактов продаж/заказов. Аналитик работает с этой моделью
  в БД/BI; сырые колонки 1С, маркетплейса и таблиц маппятся сюда конфигом.

fields:
  source_system:
    type: string
    description: Идентификатор системы-источника (ozon, 1c, google_sheet, …).
  source_record_id:
    type: string
    description: Стабильный ключ строки в источнике (номер заказа, id строки и т.п.).
  event_datetime:
    type: string
    format: iso8601
    description: Дата/время события (заказ, отгрузка — по правилам коннектора).
  amount:
    type: number
    description: Сумма в валюте currency_code (до пересчёта в RUB на этапе витрины).
  amount_rub:
    type: number
    nullable: true
    description: Сумма в рублях по курсу ЦБ РФ на дату cbr_rate_date (после enrich).
  cbr_rate_date:
    type: string
    format: date
    nullable: true
    description: Дата курса ЦБ, использованная для пересчёта.
  currency_code:
    type: string
    description: ISO-код валюты, например RUB.
  counterparty_name:
    type: string
    nullable: true
    description: Клиент/контрагент в терминах источника.
  channel:
    type: string
    nullable: true
    description: Канал продаж, если есть в источнике.
  line_description:
    type: string
    nullable: true
    description: Товар/услуга или комментарий к строке.
  status:
    type: string
    nullable: true
    description: Статус в источнике (если применимо).
  line_unit_normalized:
    type: string
    nullable: true
    description: Нормализованная ед. изм. (если задана в источнике как line_unit_raw).
  line_unit_raw:
    type: string
    nullable: true
    description: Сырая ед. изм. из источника (опционально, через маппинг).
  person_full_name:
    type: string
    nullable: true
    description: Полное ФИО (нормализованное).
  person_family_name:
    type: string
    nullable: true
  person_given_name:
    type: string
    nullable: true
  person_patronymic:
    type: string
    nullable: true
  contact_phone_e164:
    type: string
    nullable: true
    description: Телефон в формате E.164 (+7…).
  contact_email:
    type: string
    nullable: true
  country_code:
    type: string
    nullable: true
    description: ISO 3166-1 alpha-2.
  order_status_code:
    type: string
    nullable: true
    description: Канонический код статуса заказа (dim_status_map).
  payment_status_code:
    type: string
    nullable: true
  shipment_status_code:
    type: string
    nullable: true
