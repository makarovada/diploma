{% extends "base.html" %}
{% block title %}Пользователи{% endblock %}
{% block main %}
<h1>Пользователи</h1>
<table><thead><tr><th>id</th><th>Логин</th><th>email</th><th>Роли</th></tr></thead>
<tbody>
{% for u in users %}
<tr><td>{{ u.id }}</td><td>{{ u.username }}</td><td>{{ u.email or "" }}</td><td>{{ u.roles | join(", ") }}</td></tr>
{% endfor %}
</tbody></table>
{% endblock %}
