{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block main %}
<h1>Смена пароля</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
{% if ok %}<p class="ok">{{ ok }}</p>{% endif %}
<form method="post">
  <p><input type="password" name="old_password" placeholder="Текущий пароль" required /></p>
  <p><input type="password" name="new_password" placeholder="Новый пароль (≥6)" required /></p>
  <p><button type="submit">Сохранить</button></p>
</form>
{% endblock %}
