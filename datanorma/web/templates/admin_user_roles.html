{% extends "base.html" %}
{% block title %}Роли{% endblock %}
{% block main %}
<h1>Назначение ролей</h1>
<p class="meta">Добавить или снять связь пользователь ↔ роль.</p>
<h2>Добавить роль</h2>
<form method="post">
  <input type="hidden" name="action" value="add" />
  <p><label>user_id <select name="user_id">{% for u in users %}<option value="{{ u.id }}">{{ u.username }}</option>{% endfor %}</select></label></p>
  <p><label>role_id <select name="role_id">{% for r in roles %}<option value="{{ r.id }}">{{ r.name }}</option>{% endfor %}</select></label></p>
  <p><button type="submit">Добавить</button></p>
</form>
<h2>Снять роль</h2>
<form method="post">
  <input type="hidden" name="action" value="remove" />
  <p><label>user_id <select name="user_id">{% for u in users %}<option value="{{ u.id }}">{{ u.username }}</option>{% endfor %}</select></label></p>
  <p><label>role_id <select name="role_id">{% for r in roles %}<option value="{{ r.id }}">{{ r.name }}</option>{% endfor %}</select></label></p>
  <p><button type="submit">Снять</button></p>
</form>
{% endblock %}
