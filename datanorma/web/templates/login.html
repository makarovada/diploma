<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — DataNorma</title>
  <link rel="stylesheet" href="/ui/theme-ingest.css" />
  <style>
    body.login-ab {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #f4f5f7 0%, #eef0ff 50%, #f9fafb 100%);
      font-family: system-ui, -apple-system, sans-serif;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border: 1px solid var(--ab-border);
      border-radius: 12px;
      box-shadow: var(--ab-shadow-md);
      padding: 2rem;
      box-sizing: border-box;
    }
    .login-card h1 { margin: 0 0 0.25rem; font-size: 1.35rem; color: var(--ab-text); }
    .login-card .sub { color: var(--ab-muted); font-size: 0.875rem; margin: 0 0 1.25rem; line-height: 1.45; }
    .login-card input {
      width: 100%;
      box-sizing: border-box;
      margin: 0.4rem 0;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--ab-border);
      border-radius: 8px;
      font-size: 0.9rem;
    }
    .login-card button[type="submit"] {
      width: 100%;
      margin-top: 0.75rem;
      padding: 0.65rem;
      background: var(--ab-primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .login-card button[type="submit"]:hover { background: var(--ab-primary-hover); }
    .login-card .err { color: var(--ab-error); font-size: 0.875rem; }
    .login-card .foot { margin-top: 1.25rem; font-size: 0.8rem; color: var(--ab-muted); }
    .login-card .foot a { color: var(--ab-primary); }
    .logo-mark {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, #615eff 0%, #8b5cf6 100%);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body class="login-ab">
  <div class="login-card">
    <div class="logo-mark" aria-hidden="true"></div>
    <h1>Sign in to DataNorma</h1>
    <p class="sub">Консоль в стиле <strong>Ingest</strong>: Sources, Destinations, Connections. Демо: <code>seed_admin</code> / <code>AdminDemo2026</code>.</p>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <form method="post" action="/app/login">
      <input type="hidden" name="next" value="{{ next }}" />
      <input name="username" placeholder="Email or username" required autocomplete="username" />
      <input name="password" type="password" placeholder="Password" required autocomplete="current-password" />
      <button type="submit">Sign in</button>
    </form>
    <p class="foot"><a href="/docs">Developer API</a> · <a href="/ui/">Legacy UI</a></p>
  </div>
</body>
</html>
