{% extends "base.html" %}
{% block title %}Маппинги{% endblock %}
{% block main %}
<h1>Профили маппинга</h1>
<p class="meta"><a href="/app/mappings/editor">Редактор YAML →</a></p>
<table><thead><tr><th>id</th><th>name</th><th>ver</th><th>notes</th></tr></thead>
<tbody>
{% for r in rows %}
<tr><td>{{ r.id }}</td><td>{{ r.name }}</td><td>{{ r.version }}</td><td>{{ r.notes or "" }}</td></tr>
{% endfor %}
</tbody></table>
{% endblock %}
