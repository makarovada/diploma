<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>403 — DataNorma</title>
  <link rel="stylesheet" href="/ui/theme-ingest.css" />
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--ab-bg); font-family:system-ui,sans-serif; }
    .box { background:#fff; border:1px solid var(--ab-border); border-radius:12px; padding:2rem; max-width:420px; box-shadow:var(--ab-shadow-md); }
    h1 { color:var(--ab-error); margin:0 0 .5rem; font-size:1.25rem; }
    p { color:var(--ab-muted); margin:0 0 1rem; font-size:0.9rem; }
    a { color:var(--ab-primary); font-weight:600; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Access denied</h1>
    <p>{{ detail }}</p>
    <p><a href="/app/dashboard">Home</a> · <a href="/app/login">Switch account</a></p>
  </div>
</body>
</html>
